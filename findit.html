<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UG_FINDIT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/c7b2e6c21c.js" crossorigin="anonymous"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#004b45] min-h-screen font-['Poppins']">

    <!-- Navbar -->
    <div class="pt-3 px-5 flex items-center justify-between pb-20">
        <div class="flex justify-center items-center">
            <p class="text-orange-500 font-bold italic text-[1.3rem]">UG_FINDIT</p>
            <i class="fa-solid fa-magnifying-glass fa-rotate-90 text-orange-500 font-bold italic text-[1.3rem] ml-1"></i>
        </div>
        <div class="pt-3 hidden md:block">
            <nav>
                <ul class="gap-6 flex items-center justify-center font-semibold">
                    <a href="findit.html"><li class="text-white hover:text-orange-500">Browse</li></a>
                    <a href="#"><li class="text-white hover:text-orange-500">How it Works</li></a>
                    <a href="#"><li class="text-white hover:text-orange-500">Contact</li></a>
                </ul>
            </nav>
        </div>
        <div class="pt-2 flex gap-3">
            <button onclick="window.location.href='report.html'" class="rounded-full px-5 py-2 bg-orange-500 text-white font-semibold cursor-pointer">
                I found Something
            </button>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="flex flex-col items-center justify-center text-center px-4 pb-16">
        <div class="text-white text-[2.2rem] md:text-[2.5rem] font-bold">
            <h1>Lost Something on Campus?</h1>
            <h1 class="md:pl-12">Let's help you <span class="text-orange-500">Findit!</span></h1>
        </div>
        <div class="flex items-center justify-center gap-4 pt-8">
            <button onclick="window.location.href='report.html'" class="rounded-md px-6 py-2.5 bg-orange-500 text-white font-semibold cursor-pointer shadow-md">
                Report An Item
            </button>
            <button onclick="document.getElementById('items-container').scrollIntoView({behavior:'smooth'})" class="rounded-md px-6 py-2.5 bg-white text-orange-500 font-semibold cursor-pointer shadow-md">
                Browse Items
            </button>
            
        </div>
    </div>

    <!-- Browse Title -->
    <div class="max-w-6xl mx-auto px-6 text-center text-orange-500 text-[2.5rem] font-bold pb-8">
        Browse Items
    </div>

    <!-- Cards Container (JavaScript injects cards here) -->
    <div class="max-w-6xl mx-auto px-6 pb-20">
        <div id="items-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </div>

    <!-- Link to external JS -->
    <script src="script.js"></script>
</body>
</html>
