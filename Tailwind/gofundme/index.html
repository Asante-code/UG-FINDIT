<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GofundMe</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/c7b2e6c21c.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <header class="flex items-center justify-between mt-2 px-3 border-green-200 border-b-1 ">
        <div class="flex items-center gap-2" >
            <div class="flex items-center">
                <button class="bg-white-500 hover:bg-green-200 w-[7rem] h-10 text-black  justify-center flex items-center rounded-full">
                    <i class="fa-solid fa-magnifying-glass" style="color:black;"></i>
                    Search
                </button>
            </div>
            <div class="flex items-center">
                <button class="bg-white-500 hover:bg-green-200 w-[7rem] h-10 text-black text-center flex items-center justify-center rounded-full">
                    Donate ▼
                </button>
            </div>
            <div class="flex items-center">
                    <button class="bg-white-500 hover:bg-green-200 w-[7rem] h-10 text-black text-center flex items-center justify-center rounded-full">
                        Fundraise ▼
                    </button>
            </div>
        </div>

        <div>
            <img src="gofundme1.png" alt="logo" class=" h-[3rem]">


        </div>
        <div class="flex items-center gap-3">
            <div>
                <button class="bg-white-500 hover:bg-green-200 w-[7rem] h-10 text-black text-center flex items-center justify-center rounded-full">
                    About ▼
                </button>
            </div>
            <div>
                <button class="bg-white-500 hover:bg-green-200 w-[7rem] h-10 text-black text-center flex items-center justify-center rounded-full">
                    Sign In
                </button>

            </div>
            <div>
                <button class="bg-white-500 hover:bg-green-200 w-[10rem] h-10 text-black font-bold text-center flex items-center justify-center rounded-full  border-1 border-black-500">
                    Start a GoFundMe
                </button>

            </div>
           

        </div>

            
            


        
    </header>
        <div class=" relative flex items-center justify-center w-full h-[20rem] text-[#272727]" >
            <div class="absolute bg-[#aefb8f] rounded-lg text-center font-bold w-[13rem]">
                <p>#1 crowdfunding Platform</p>
            </div>

             <div class="  absolute flex text-center justify-center  font-bold text-[#272727] text-[4rem] pt-[15rem] px-[5rem] w-[50rem] ">
                <p>Where Successfull Fundraisers Start</p>

            </div>

            <div class=" absolute flex text-center justify-center pt-[35rem]">
                <button class=" bg-[#004c3a] hover:bg-[#006b52]  font-bold text-yellow-300 rounded-full w-[10rem] h-[3rem] border-1">
                    Start a GoFundMe
                    
                </button>

            </div>
            
        </div>
        <main class="flex">
            <div>
                <img src="in_need" alt="">

            </div>
            <div flex="">

            </div>

        </main>
    

    

       
        


    
</body>
</html>
